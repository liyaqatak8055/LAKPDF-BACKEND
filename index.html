  <!-- ====== PERFORMANCE: Preload critical Inter fonts (eliminates FOIT + LCP font delay) ====== -->
  <!-- Note: Vite hashes these at build time; these preloads use the source paths which -->
  <!-- the makeStylesAsync plugin resolves. For production, Netlify serves from /assets/fonts/ -->
  <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous"
    href="/assets/fonts/inter-latin-400-normal.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous"
    href="/assets/fonts/inter-latin-500-normal.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous"
    href="/assets/fonts/inter-latin-600-normal.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous"
    href="/assets/fonts/inter-latin-700-normal.woff2" />

  <!-- Noto Sans Devanagari — load async (non-critical) -->
  <link rel="stylesheet"

  <style>
    /* Critical above-fold styles — prevents blank white screen */

    /* Inter @font-face — declared here so the font loads as soon as the browser
       parses HTML (the woff2 files are already being fetched via the preload hints above).
       NOTE: injectFontPreloads() in vite.config.ts patches these src URLs to
       content-hashed filenames at build time. */
    @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('/assets/fonts/inter-latin-400-normal.woff2') format('woff2')}
    @font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url('/assets/fonts/inter-latin-500-normal.woff2') format('woff2')}
    @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('/assets/fonts/inter-latin-600-normal.woff2') format('woff2')}
    @font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url('/assets/fonts/inter-latin-700-normal.woff2') format('woff2')}

    /* Reset */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    /* CSS variables — set before paint to prevent flash */
    :root{
      color-scheme: light;
      --bg-primary:#f6f7f9;
      --bg-surface:#ffffff;
      --text-primary:#1e293b;
      --text-secondary:#64748b;
      --border-color:#e2e8f0;
    }
    html.dark{
      color-scheme: dark;
      --bg-primary:#0f172a;
      --bg-surface:#1e293b;
      --text-primary:#f1f5f9;
      --text-secondary:#cbd5e1;
      --border-color:#334155;
    }

    /* Layout — prevents CLS */
    html{
      background-color:var(--bg-primary);
      max-width:100%;
      overflow-x:hidden;
    }
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      -webkit-font-smoothing:antialiased;
      background-color:var(--bg-primary);
      color:var(--text-primary);
      min-height:100vh;
      max-width:100%;
      overflow-x:hidden;
      overscroll-behavior-x:none;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }
    html.dark body{background-color:#0f172a;color:#f1f5f9}
    #root{max-width:100%;overflow-x:hidden;min-height:100vh}
    input,select,textarea,button{font-size:16px}

    /* Inline loading spinner — shown before React hydrates */
    .initial-loader{
      display:flex;align-items:center;justify-content:center;min-height:100vh;
    }
    .initial-loader__spinner{
      width:36px;height:36px;
      border:3px solid #e2e8f0;
      border-top-color:#e5323f;
      border-radius:50%;
      animation:_spin .65s linear infinite;
    }
    @keyframes _spin{to{transform:rotate(360deg)}}
  </style>

  <!-- ====== DARK MODE: runs before paint to prevent flash ====== -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('lakpdf-theme');
        var theme = stored === 'light' || stored === 'dark' ? stored : 'light';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

  <!-- ====== Google AdSense — deferred until idle ====== -->
  <script>
    (function () {
      var host = window.location.hostname || '';
      var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0' || host.endsWith('.local');
      if (isLocal) return;
      var loadAds = function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9704679803624436';
        s.crossOrigin = 'anonymous';
        document.head.appendChild(s);
      };
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadAds, { timeout: 4000 });
      } else {
        setTimeout(loadAds, 4000);
      }
    })();
  </script>

  <!-- Auto-recovery for stale cached Service Workers or outdated script hashes -->
  <script>
    window.addEventListener('error', function(e) {
      var msg = (e && (e.message || '')) + '';
      var src = (e && e.target && e.target.src) || '';
      var isMimeOrChunkError = msg.indexOf('MIME type') !== -1 ||
                               msg.indexOf('Failed to fetch') !== -1 ||
                               msg.indexOf('Loading chunk') !== -1 ||
                               msg.indexOf('Failed to load module script') !== -1 ||
                               src.indexOf('/assets/js/') !== -1;
      if (isMimeOrChunkError) {
        var key = 'lakpdf_cache_recover_ts';
        var last = parseInt(sessionStorage.getItem(key) || '0', 10);
        var now = Date.now();
        if (now - last > 8000) {
          sessionStorage.setItem(key, String(now));
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  for (var j = 0; j < names.length; j++) { caches.delete(names[j]); }
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            });
          } else {
            window.location.reload();
          }
        }
      }
    }, true);
  </script>
