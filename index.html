  <!-- ====== PERFORMANCE: Preload critical Inter fonts (eliminates FOIT + LCP font delay) ====== -->
  <!-- Note: Vite hashes these at build time; these preloads use the source paths which -->

  <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous"

  <!-- Noto Sans Devanagari — deferred to idle to ensure 0 critical path contention -->
  <script>
    (function () {
      function loadDevanagari() {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600&display=swap';
        document.head.appendChild(l);
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadDevanagari, { timeout: 4000 });
      } else {
        window.addEventListener('load', function () { setTimeout(loadDevanagari, 1500); }, { once: true });
      }
    })();
  </script>

  <!-- ====== Google AdSense (Deferred to keep FCP/LCP instant) ====== -->
  <script>
    (function () {
      function isLocalHost() {
        var host = window.location.hostname;
        return host === 'localhost' ||
               host === '127.0.0.1' ||
               host === '0.0.0.0' ||
               /^192\.168\./.test(host) ||
               /^10\./.test(host) ||
               /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(host) ||
               host.endsWith('.local');
      }
      function loadAdSense() {
        if (isLocalHost() || window.__adsense_loaded) return;
        window.__adsense_loaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9704679803624436';
        document.head.appendChild(s);
      }
      if (isLocalHost()) return;
      if (document.readyState === 'complete') {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadAdSense, { timeout: 3000 });
        } else {
          setTimeout(loadAdSense, 2000);
        }
      } else {
        window.addEventListener('load', function () {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadAdSense, { timeout: 3000 });
          } else {
            setTimeout(loadAdSense, 2000);
          }
        }, { once: true });
      }
    })();
  </script>

  <!-- Auto-recovery for stale cached Service Workers or outdated script hashes -->
  <script>
    window.addEventListener('error', function(e) {
      var msg = (e && (e.message || '')) + '';
      var src = (e && e.target && e.target.src) || '';
      var isMimeOrChunkError = msg.indexOf('MIME type') !== -1 ||
                               msg.indexOf('Failed to fetch') !== -1 ||
                               msg.indexOf('Loading chunk') !== -1 ||
                               msg.indexOf('Failed to load module script') !== -1 ||
                               src.indexOf('/assets/js/') !== -1;
      if (isMimeOrChunkError) {
        var key = 'lakpdf_cache_recover_ts';
        var last = parseInt(sessionStorage.getItem(key) || '0', 10);
        var now = Date.now();
        if (now - last > 8000) {
          sessionStorage.setItem(key, String(now));
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  for (var j = 0; j < names.length; j++) { caches.delete(names[j]); }
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            });
          } else {
            window.location.reload();
          }
        }
      }
    }, true);
  </script>
